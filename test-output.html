<!DOCTYPE html>
<html>

<head>
  <title>Sales Report</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      padding: 40px;
    }

    h2,
    h3 {
      text-align: center;
      margin-bottom: 30px;
    }

    .table-container {
      max-width: 1000px;
      margin: 0 auto;
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      padding: 14px 18px;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background-color: #4a90e2;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
    }

    tr:hover {
      background-color: #f1f7ff;
    }

    @media (max-width: 768px) {
      table {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <h2>Sales Report</h2>
  <h3>
    yearly Sales Report
  </h3>
  <div class="table-container">
    
      <table>
        <thead>
          <tr>
            <th>Sl No</th>
            <th>
              Year
            </th>
            <th>Order Count</th>
            <th>Discount Given</th>
            <th>Total Amount</th>


          </tr>
        </thead>
        <tbody>
          
            <tr>
              <td>
                1
              </td>
              <td>
                2025
              </td>
              <td>
                2
              </td>
              <td>₹ 30.00
              </td>
              <td>₹ 1370.00
              </td>
            </tr>
            
              <tr>
                <th colspan="2" style="text-align: right;">Total</th>
                <th>
                  2
                </th>
                <th>₹ 30.00
                </th>
                <th>₹ 1370.00
                </th>
              </tr>
        </tbody>
        
      </table>
  </div>

</body>

</html>
